# Playwright e2e suite against the fake Google (e2e/playwright/fake-google). Needs no Google accounts or
# secrets, so it runs on every PR, forks included. The real-Google lane (`make e2e E2E_GOOGLE=real`)
# is not in CI yet: it waits for the Google Workspace test org and its GCP project.
# Adapted from the Google Drive suite's e2e.yml.
name: e2e

on:
  push:
    branches:
      - master
  pull_request:

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Two servers: the oldest the plugin supports (min_server_version 12.0.0 in plugin.json; bump
  # this with it), and master, which catches core changes that break the plugin before they ship.
  # Only min-server gates merges: master moves daily, so a core regression there should be visible
  # without blocking unrelated plugin PRs.
  fake-google:
    name: fake-google (${{ matrix.server }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    continue-on-error: ${{ matrix.server == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: min-server
            image: mattermost/mattermost-enterprise-edition:12.0
          - server: master
            image: mattermostdevelopment/mattermost-enterprise-edition:master
    env:
      # Read by e2e/playwright/docker-compose.yml (via make e2e-env-up).
      MM_IMAGE: ${{ matrix.image }}
    defaults:
      run:
        working-directory: e2e/playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            e2e/playwright/package-lock.json

      # Runs in the background so the image pulls overlap with the plugin build (as in
      # mattermost-plugin-mscalendar's e2e.yml).
      - name: Start the stack
        working-directory: .
        run: |
          (make e2e-env-up > "$RUNNER_TEMP/stack-up.log" 2>&1; echo $? > "$RUNNER_TEMP/stack-up.exit") &

      - name: Build the plugin bundle
        working-directory: .
        run: make dist

      - name: Install e2e dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      # Typecheck (suite and fake), test-doc lint, the Node/Go encryption vector, and the fake's
      # smoke tests.
      - name: Check
        run: npm run check

      - name: Wait for the stack to be healthy
        timeout-minutes: 10
        run: |
          while [ ! -f "$RUNNER_TEMP/stack-up.exit" ]; do sleep 5; done
          cat "$RUNNER_TEMP/stack-up.log"
          exit "$(cat "$RUNNER_TEMP/stack-up.exit")"

      - name: Run the suite against the fake Google
        run: npm test
        env:
          CI: "true"

      - name: Collect container logs
        if: failure()
        working-directory: .
        run: |
          mkdir -p e2e/playwright/logs
          make --no-print-directory e2e-env-logs > e2e/playwright/logs/containers.log 2>&1 || true

      # Traces and screenshots stay off in CI (playwright.config.ts), and the fake Google issues
      # throwaway tokens, so these hold no secrets.
      - name: Upload report and logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report-${{ matrix.server }}
          path: |
            e2e/playwright/results/reporter
            e2e/playwright/logs
          retention-days: 7

      - name: Stop the stack
        if: always()
        working-directory: .
        run: make e2e-env-down

  # Screenshot baselines (e2e/playwright/specs/visual.spec.ts) on a pinned server with a dockerized browser.
  # Non-blocking until it has a track record; when a baseline changes, a person looks at the diff and
  # commits new PNGs (npm run test:visual-update-snapshots). The committed baselines were rendered on
  # arm64 and match this amd64 run.
  visual:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: e2e/playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            e2e/playwright/package-lock.json

      - name: Build the plugin bundle
        working-directory: .
        run: make dist

      # No local browser: the run uses the Playwright container that script/visual.sh starts in its
      # own compose project, and stops at the end.
      - name: Install e2e dependencies
        run: npm ci --ignore-scripts

      - name: Compare screenshots with the baselines
        run: npm run test:visual
        env:
          CI: "true"

      # Only the fake Google's tokens and a throwaway server's data end up in these.
      - name: Upload report, diffs and logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-visual-report
          path: |
            e2e/playwright/results/reporter
            e2e/playwright/results/output
            e2e/playwright/logs
          retention-days: 7
